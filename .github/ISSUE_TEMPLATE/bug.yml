name: 問題回報
description: 功能壞了、畫面怪怪的、App 當掉
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "這裡是公開的，請不要貼體重、用藥、身體狀況等健康資料或含個人資訊的照片。"
  - type: textarea
    id: what
    attributes:
      label: 發生了什麼事
      placeholder: 例如：按下「下一餐建議」後一直轉圈，最後顯示失敗
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎麼重現
      placeholder: "1. 打開今日頁\n2. 點下一餐建議\n3. 選外送"
  - type: input
    id: when
    attributes:
      label: 大約什麼時候發生
      placeholder: 例如：11/18 下午 2 點左右
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App 版本與 iPhone 型號
      placeholder: 設定頁最下面的版本號，例如 0.1.0、iPhone 15 Pro
  - type: textarea
    id: screenshot
    attributes:
      label: 截圖（可選）
      description: 貼上前請確認畫面上沒有你的健康數字或個人資訊，必要時先遮掉
